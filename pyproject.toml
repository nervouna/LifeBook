[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifebook"
version = "0.1.0"
description = "Personal knowledge base with LLM-driven processing."
requires-python = ">=3.10"
license = "WTFPL"
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
    "click>=8.1.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "lxml>=5.0.0",
    "lark-oapi>=1.4.0",
    "tavily-python>=0.5.0",
    "httpx[socks]>=0.27.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
lifebook = "lifebook.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lifebook*"]
