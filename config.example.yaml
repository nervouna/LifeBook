# LifeBook config template
# Run 'lifebook init' to create this file with default values

knowledge:
  root: /path/to/Knowledge
  sources_dir: 10-sources
  topics_dir: 20-topics
  trajectories_dir: 30-trajectories
  state_dir: .lifebook
  categories:
    - Category1
    - Category2

llm:
  provider: anthropic
  base_url: https://api.anthropic.com
  api_key: ""  # sk-ant-xxx
  model: claude-sonnet-4-5
  digest_model: claude-sonnet-4-5
  max_tokens: 4096
  temperature: 0.3
  timeout: 120
  extra_headers: {}

feishu:
  app_id: ""  # cli_xxx
  app_secret: ""
  digest_chat_id: ""  # oc_xxx

executor:
  batch_limit: 20
  fetch_timeout: 30
  user_agent: "Mozilla/5.0 LifeBook/0.1"
  classify_min_confidence: 0.5

digest:
  schedule: "23:30"
  include_anomalies: true
  max_related_per_item: 3

logging:
  level: INFO
  retention_days: 30
