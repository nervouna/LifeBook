# LifeBook config template
# Run 'lifebook init' to create this file with default values

knowledge:
  root: /path/to/Knowledge
  sources_dir: 10-sources
  topics_dir: 20-topics
  trajectories_dir: 30-trajectories
  state_dir: .lifebook
  categories:
    - Category1
    - Category2

llm:
  base_url: https://api.example.com
  api_key: ""  # your-api-key
  model: model-name
  digest_model: model-name
  max_tokens: 4096
  temperature: 0.3
  timeout: 120
  extra_headers: {}

feishu:
  app_id: ""  # cli_xxx
  app_secret: ""
  digest_chat_id: ""  # oc_xxx

executor:
  batch_limit: 20
  fetch_timeout: 30
  user_agent: "Mozilla/5.0 LifeBook/0.1"
  classify_min_confidence: 0.5

tavily:
  api_key: ""
  extract_depth: advanced
  timeout: 30

fetch:
  skip_domains: []
  enable_fallback: true
  user_agent: "Mozilla/5.0 LifeBook/0.1"
  timeout: 30

digest:
  schedule: "23:30"
  include_anomalies: true
  max_related_per_item: 3

logging:
  level: INFO
  retention_days: 30

image:
  max_long_edge: 1568
  max_bytes: 1048576
  jpeg_quality: 85

# Optional: separate provider for vision models.
# If omitted, the main llm config is used for images.
# vision:
#   base_url: https://api.example.com
#   api_key: ""
#   model: vision-model-name
#   max_tokens: 4096
#   temperature: 0.3
#   timeout: 120
